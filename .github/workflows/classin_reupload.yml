name: ClassIn Video Reupload

on:
  workflow_dispatch:
    inputs:
      dest_folder_id:
        description: "Destination Google Drive folder ID"
        required: true
        type: string
      max_workers:
        description: "Parallel HTTP-to-Drive upload workers"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
        default: "3"
      force_retry:
        description: "Ignore upload checkpoint and retry media"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: classin-video-reupload
  cancel-in-progress: false

jobs:
  upload:
    name: Reupload ClassIn videos
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEST_FOLDER_ID: ${{ inputs.dest_folder_id }}
      MAX_WORKERS: ${{ inputs.max_workers }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install upload dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            google-api-python-client==2.131.0 \
            google-auth==2.29.0 \
            google-auth-httplib2==0.2.0 \
            "requests>=2.31.0"

      - name: Restore upload checkpoint
        id: restore-checkpoint
        uses: actions/cache/restore@v4
        with:
          path: classin_reupload_checkpoint.json
          key: classin-reupload-${{ github.run_id }}
          restore-keys: |
            classin-reupload-

      - name: Create temporary inputs
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN }}
          CLASSIN_MEDIA_JSON: ${{ secrets.CLASSIN_VIDEO_MEDIA }}
          CLASSIN_MAPPING_JSON: ${{ secrets.CLASSIN_VIDEO_MAPPING }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          values = {
              "token.json": os.environ.get("DRIVE_TOKEN_JSON", ""),
              "classin_media.json": os.environ.get("CLASSIN_MEDIA_JSON", ""),
              "classin_mapping.json": os.environ.get("CLASSIN_MAPPING_JSON", ""),
          }
          for name, value in values.items():
              if not value:
                  raise SystemExit(f"Missing Actions secret for {name}")
              json.loads(value)
              (Path(os.environ["RUNNER_TEMP"]) / name).write_text(value, encoding="utf-8")
          PY

      - name: Upload ClassIn videos
        run: |
          extra=()
          if [[ "${{ inputs.force_retry }}" == "true" ]]; then
            extra+=(--force-retry)
          fi
          python classin_reupload.py \
            --media-payload "$RUNNER_TEMP/classin_media.json" \
            --mapping-payload "$RUNNER_TEMP/classin_mapping.json" \
            --token-file "$RUNNER_TEMP/token.json" \
            --dest-folder-id "$DEST_FOLDER_ID" \
            --max-workers "$MAX_WORKERS" \
            --checkpoint-file classin_reupload_checkpoint.json \
            --report-file classin_reupload_report.json \
            "${extra[@]}"

      - name: Upload redacted report
        if: always() && hashFiles('classin_reupload_report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: classin-reupload-report-${{ github.run_id }}
          path: classin_reupload_report.json
          if-no-files-found: error
          retention-days: 30

      - name: Save upload checkpoint
        if: always() && hashFiles('classin_reupload_checkpoint.json') != ''
        uses: actions/cache/save@v4
        with:
          path: classin_reupload_checkpoint.json
          key: classin-reupload-${{ github.run_id }}

      - name: Remove temporary inputs
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/token.json" \
            "$RUNNER_TEMP/classin_media.json" \
            "$RUNNER_TEMP/classin_mapping.json"
