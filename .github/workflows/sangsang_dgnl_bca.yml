name: Sangsang Course Video Reupload

on:
  workflow_dispatch:
    inputs:
      course_slug:
        description: "Sangsang course slug"
        required: true
        type: string
        default: "dgnl-bca"
      dest_folder_id:
        description: "Destination Google Drive folder ID"
        required: true
        type: string
      max_workers:
        description: "Parallel ffmpeg and Drive upload workers"
        required: true
        type: choice
        options:
          - "1"
          - "2"
        default: "1"
      download_timeout:
        description: "Maximum seconds for one HLS-to-MP4 conversion"
        required: true
        type: number
        default: 7200
      limit:
        description: "First N lessons only; 0 uploads the whole course"
        required: true
        type: number
        default: 0
      force_retry:
        description: "Ignore checkpoint and existing-file checks"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sangsang-${{ inputs.course_slug }}-${{ inputs.dest_folder_id }}
  cancel-in-progress: false

jobs:
  upload:
    name: Upload Sangsang videos to Drive
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      COURSE_SLUG: ${{ inputs.course_slug }}
      DEST_FOLDER_ID: ${{ inputs.dest_folder_id }}
      MAX_WORKERS: ${{ inputs.max_workers }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Install upload dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            google-api-python-client==2.131.0 \
            google-auth==2.29.0 \
            google-auth-httplib2==0.2.0 \
            "requests>=2.31.0"

      - name: Restore upload checkpoint
        uses: actions/cache/restore@v4
        with:
          path: sangsang_reupload_checkpoint.json
          key: sangsang-${{ inputs.course_slug }}-${{ inputs.dest_folder_id }}-${{ github.run_id }}
          restore-keys: |
            sangsang-${{ inputs.course_slug }}-${{ inputs.dest_folder_id }}-

      - name: Create temporary Drive credentials
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = os.environ.get("DRIVE_TOKEN_JSON", "")
          if not value:
              raise SystemExit("Missing Actions secret: DRIVE_TOKEN")
          json.loads(value)
          path = Path(os.environ["RUNNER_TEMP"]) / "token.json"
          path.write_text(value.lstrip("\ufeff").strip(), encoding="utf-8")
          path.chmod(0o600)
          PY

      - name: Upload Sangsang course
        run: |
          extra=()
          if [[ "${{ inputs.force_retry }}" == "true" ]]; then
            extra+=(--force-retry)
          fi
          python sangsang_reupload.py \
            --course-slug "$COURSE_SLUG" \
            --token-file "$RUNNER_TEMP/token.json" \
            --dest-folder-id "$DEST_FOLDER_ID" \
            --max-workers "$MAX_WORKERS" \
            --download-timeout "${{ inputs.download_timeout }}" \
            --limit "${{ inputs.limit }}" \
            --checkpoint-file sangsang_reupload_checkpoint.json \
            --report-file sangsang_reupload_report.json \
            "${extra[@]}"

      - name: Upload redacted report
        if: always() && hashFiles('sangsang_reupload_report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sangsang-reupload-report-${{ github.run_id }}
          path: sangsang_reupload_report.json
          if-no-files-found: error
          retention-days: 30

      - name: Save upload checkpoint
        if: always() && hashFiles('sangsang_reupload_checkpoint.json') != ''
        uses: actions/cache/save@v4
        with:
          path: sangsang_reupload_checkpoint.json
          key: sangsang-${{ inputs.course_slug }}-${{ inputs.dest_folder_id }}-${{ github.run_id }}

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/token.json"
