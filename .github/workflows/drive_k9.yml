name: Drive K9 Manual Sync

on:
  workflow_dispatch:
    inputs:
      source_folder_ids:
        description: "Source folder ID(s), separated by commas"
        required: true
        type: string
        default: "107CZgk5F7iRX_b9Esa1avdOEkwTIMKIh"
      dest_folder_id:
        description: "Destination folder ID"
        required: true
        type: string
        default: "1jzw1q9Chb9CQRdWXgu0qMP3jmMgmq8As"
      max_workers:
        description: "Google Drive API workers"
        required: true
        type: choice
        options:
          - "4"
          - "6"
          - "8"
        default: "6"
      force_full_scan:
        description: "Ignore saved smart-scan state"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: drive-k9-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      SOURCE_FOLDER_IDS: ${{ inputs.source_folder_ids }}
      DEST_FOLDER_ID: ${{ inputs.dest_folder_id }}
      MAX_WORKERS: ${{ inputs.max_workers }}
      MAX_STREAM_WORKERS: "4"
      MAX_PDF_WORKERS: "1"
      FORCE_FULL_SCAN: ${{ inputs.force_full_scan && '1' || '0' }}
      AUTO_COOKIE_REFRESH: "0"
      NO_COLOR: "1"
      NO_LIVE_UI: "1"
      PLAIN_UI: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore sync state
        uses: actions/cache@v4
        with:
          path: |
            sync_checkpoint.json
            sync_state.json
            blocked_pdf_upload_checkpoint.json
          key: drive-k9-state-${{ github.run_id }}
          restore-keys: |
            drive-k9-state-
          save-always: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Create temporary credentials
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN }}
          DRIVE_COOKIE_CONTENT: ${{ secrets.DRIVE_COOKIE }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          token = os.environ.get("DRIVE_TOKEN_JSON", "")
          cookie = os.environ.get("DRIVE_COOKIE_CONTENT", "")
          if not token:
              raise SystemExit("Missing Actions secret: DRIVE_TOKEN")
          if not cookie:
              raise SystemExit("Missing Actions secret: DRIVE_COOKIE")

          json.loads(token)
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          (runner_temp / "token.json").write_text(token, encoding="utf-8")
          (runner_temp / "cookie.txt").write_text(cookie, encoding="utf-8")
          PY

      - name: Run Drive K9 sync
        run: |
          python windows_sync_tool_improved.py \
            --token-file "$RUNNER_TEMP/token.json" \
            --cookie-file "$RUNNER_TEMP/cookie.txt" \
            --no-auto-cookie-refresh \
            --no-input-prompt

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/token.json" "$RUNNER_TEMP/cookie.txt"

