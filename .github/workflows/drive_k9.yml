name: Drive K9 Sync

on:
  schedule:
    # 22:00 giờ Việt Nam (UTC+7) mỗi ngày. GitHub có thể trễ vài phút đến vài chục phút khi tải cao.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      source_folder_ids:
        description: "Source folder ID(s), separated by commas"
        required: true
        type: string
        default: "107CZgk5F7iRX_b9Esa1avdOEkwTIMKIh"
      dest_folder_id:
        description: "Destination folder ID"
        required: true
        type: string
        default: "1O3DFShrB_4XvuaGl1U3C0qJ0QyOuyGvi"
      max_workers:
        description: "Google Drive API workers"
        required: true
        type: choice
        options:
          - "4"
          - "6"
          - "8"
        default: "6"
      force_full_scan:
        description: "Ignore saved smart-scan state"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: drive-k9-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      # Lần chạy theo lịch không có inputs nên dùng giá trị mặc định.
      SOURCE_FOLDER_IDS: ${{ inputs.source_folder_ids || '107CZgk5F7iRX_b9Esa1avdOEkwTIMKIh' }}
      DEST_FOLDER_ID: ${{ inputs.dest_folder_id || '1O3DFShrB_4XvuaGl1U3C0qJ0QyOuyGvi' }}
      MAX_WORKERS: ${{ inputs.max_workers || '6' }}
      MAX_STREAM_WORKERS: "4"
      MAX_PDF_WORKERS: "1"
      FORCE_FULL_SCAN: ${{ inputs.force_full_scan && '1' || '0' }}
      AUTO_COOKIE_REFRESH: "0"
      NO_COLOR: "1"
      NO_LIVE_UI: "1"
      PLAIN_UI: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore sync state
        uses: actions/cache@v4
        with:
          path: |
            sync_checkpoint.json
            sync_state.json
            blocked_pdf_upload_checkpoint.json
          key: drive-k9-state-${{ github.run_id }}
          restore-keys: |
            drive-k9-state-
          save-always: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Create temporary credentials
        env:
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN }}
          DRIVE_COOKIE_CONTENT: ${{ secrets.DRIVE_COOKIE }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          token = os.environ.get("DRIVE_TOKEN_JSON", "")
          cookie = os.environ.get("DRIVE_COOKIE_CONTENT", "")
          if not token:
              raise SystemExit("Missing Actions secret: DRIVE_TOKEN")
          if not cookie:
              raise SystemExit("Missing Actions secret: DRIVE_COOKIE")

          json.loads(token)
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          (runner_temp / "token.json").write_text(token, encoding="utf-8")
          (runner_temp / "cookie.txt").write_text(cookie, encoding="utf-8")
          PY

      - name: Check and refresh Google cookie
        id: cookie
        continue-on-error: true
        env:
          SECRETS_PAT: ${{ secrets.SECRETS_PAT }}
        run: |
          if [ -n "$SECRETS_PAT" ]; then
            python cookie_maintenance.py --cookie-file "$RUNNER_TEMP/cookie.txt" --rotate
          else
            echo "::warning::Chưa có secret SECRETS_PAT nên không tự làm mới cookie (không lưu lại được cookie mới)."
            python cookie_maintenance.py --cookie-file "$RUNNER_TEMP/cookie.txt"
          fi

      - name: Save refreshed cookie to DRIVE_COOKIE
        if: steps.cookie.outputs.rotated == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          gh secret set DRIVE_COOKIE --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/cookie.txt"
          echo "Đã lưu cookie mới vào secret DRIVE_COOKIE."

      - name: Run Drive K9 sync
        run: |
          python windows_sync_tool_improved.py \
            --token-file "$RUNNER_TEMP/token.json" \
            --cookie-file "$RUNNER_TEMP/cookie.txt" \
            --no-auto-cookie-refresh \
            --no-input-prompt

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/token.json" "$RUNNER_TEMP/cookie.txt"

      # Đánh fail run (GitHub gửi email báo lỗi) để cookie chết không bị lặng lẽ bỏ qua.
      - name: Fail if Google cookie is unusable
        if: always() && (steps.cookie.outcome == 'failure' || steps.cookie.outputs.signed_in == '0')
        run: |
          if [ "${{ steps.cookie.outputs.signed_in }}" = "0" ]; then
            echo "::error::Cookie DRIVE_COOKIE đã bị Google đăng xuất — video bị chặn tải không được. Xuất cookie mới của tài khoản đích rồi cập nhật secret DRIVE_COOKIE."
          else
            echo "::error::Không kiểm tra được cookie DRIVE_COOKIE — xem log bước 'Check and refresh Google cookie'."
          fi
          exit 1

